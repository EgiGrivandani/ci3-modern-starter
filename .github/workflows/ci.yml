name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5.12', '8.5']
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite3
      DB_DATABASE: ':memory:'
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, xml, xmlwriter, sqlite3, pdo_sqlite, mysqli
          tools: composer:v2
          coverage: none
      - name: Validate dependencies
        run: composer validate --strict
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare local test configuration
        run: cp .env.example .env
      - name: Check configuration
        run: composer check
      - name: Check PHP formatting
        if: matrix.php == '8.5.12'
        run: composer format:check
      - name: Run tests
        run: composer test
